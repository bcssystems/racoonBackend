spring.application.name=bonds
server.port=8030

spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/intranet_racoon
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=./uploads/multimedia

application.security.jwt.secret-key=miClaveSecretaMuySeguraQueEsLoSuficientementeLarga
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

wasender.enabled=${WASENDER_ENABLED:false}
wasender.api-url=${WASENDER_API_URL:https://wasenderapi.com/api}
wasender.api-token=${WASENDER_API_TOKEN:}
wasender.country-code=${WASENDER_COUNTRY_CODE:52}
wasender.time-zone=${WASENDER_TIME_ZONE:America/Mexico_City}

# Código postal: solo se guarda caché de los C.P. consultados, no el catálogo nacional.
postal.cache-hours=${POSTAL_CACHE_HOURS:168}
postal.codigoszip-url=${POSTAL_CODIGOSZIP_URL:https://api.codigos.zip/api/zip/{cp}?pais=MX}
postal.codigoszip-key=${CODIGOS_ZIP_API_KEY:}
postal.fallback-url=${POSTAL_FALLBACK_URL:https://api.zippopotam.us/MX/{cp}}

# Google Maps: restringe la browser key por dominio y la server key por IP/API en Google Cloud.
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}
google.maps.server-api-key=${GOOGLE_MAPS_SERVER_API_KEY:}
